# SymmetricDS engine configuration for the local monitoring node.
# Remote sync is not yet configured — fill in registration.url and
# remote node details when the hub is ready.

engine.name=monitoring-node

# Database connection
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
db.user=sym_user
db.password=$(SYM_PASSWORD)

# Node identity
group.id=edge
external.id=001

# Local sync URL (how other nodes reach this one)
sync.url=http://134.30.153.231:31415/sync/monitoring-node

# Hub registration URL
+registration.url=http://172.30.220.81:31415/sync/outdoor-hub
+#registration.url=http://grafana01.csn29.bessy.de/sync/outdoor-hub

# Match the nginx proxy_read_timeout (300s) so a slow batch
# doesn't get killed by the edge before nginx would cut it.
transport.http.timeout=300000

# Retry automatically when PostgreSQL raises a deadlock (40P01).
# The routing/push jobs contend with capture triggers under heavy ingestion load.
deadlock.retry.count=10
deadlock.retry.delay.ms=2000

# Single routing thread avoids concurrent sym_data_event inserts racing each other.
job.routing.thread.count=1

