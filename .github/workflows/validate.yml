name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check (dashboard + ingestion)
        run: |
          python3 -m compileall -q dashboard ingestion
          echo "Python syntax OK."

      - name: Check migration numbering (append-only, no gaps beyond known V13)
        run: |
          python3 - <<'EOF'
          import re, glob, sys
          versions = sorted(int(re.match(r'V(\d+)__', f.split('/')[-1]).group(1))
                            for f in glob.glob('migrations/V*.sql'))
          dupes = {v for v in versions if versions.count(v) > 1}
          if dupes:
              sys.exit(f"duplicate migration versions: {dupes}")
          # V13 is a known historical gap
          expected = [v for v in range(versions[0], versions[-1] + 1) if v != 13]
          missing = set(expected) - set(versions)
          if missing:
              sys.exit(f"missing migration versions: {sorted(missing)}")
          print(f"Migrations OK: V{versions[0]}–V{versions[-1]} ({len(versions)} files)")
          EOF

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.25.2-pg17
        env:
          POSTGRES_DB: outdoor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d outdoor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations (Flyway, same image as production)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/outdoor_test \
            -e FLYWAY_USER=test -e FLYWAY_PASSWORD=test \
            -e FLYWAY_PLACEHOLDERS_SYM_PASSWORD=test \
            flyway/flyway:11-alpine migrate

      - name: Parser and ingestion tests
        env:
          INGEST_TEST_DB: "1"
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: outdoor_test
          PGUSER: test
          PGPASSWORD: test
        run: pytest -q
