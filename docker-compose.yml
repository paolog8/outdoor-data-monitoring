services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    env_file: .env
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_PLACEHOLDERS_SYM_PASSWORD: ${SYM_PASSWORD}
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  symmetricds:
    image: jumpmind/symmetricds:3.17.0
    container_name: symmetricds
    restart: unless-stopped
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      SYM_PASSWORD: ${SYM_PASSWORD}
      SYM_SERVER_ADDRESS: ${SYM_SERVER_ADDRESS}
      SYM_SERVER_PORT: ${SYM_SERVER_PORT}
      no_proxy: grafana01.csn29.bessy.de
      NO_PROXY: grafana01.csn29.bessy.de
      JAVA_OPTS: "-Dhttp.nonProxyHosts=grafana01.csn29.bessy.de|localhost|127.0.0.1"
    volumes:
      - ./symmetricds/engines:/opt/symmetric-ds/engines
    ports:
      - "31415:31415"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:31415/ > /dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_ROOT: /data
      BATCH_SIZE: "1000"
      DRY_RUN: "${DRY_RUN:-false}"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      symmetricds:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # Pass DB credentials for provisioning interpolation
      DB_NAME: ${POSTGRES_DB:-outdoor_monitoring}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/repo-dashboards:ro
    # - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  symmetricds_data:
