services:

  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    env_file: .env
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_PLACEHOLDERS_SYM_PASSWORD: ${SYM_PASSWORD}
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  symmetricds:
    image: jumpmind/symmetricds:latest
    container_name: symmetricds
    restart: unless-stopped
    env_file: .env
    environment:
      SYM_PASSWORD: ${SYM_PASSWORD}
      NO_PROXY: "solar-energy-data.helmholtz-berlin.de"
      no_proxy: "solar-energy-data.helmholtz-berlin.de"
      JAVA_TOOL_OPTIONS: "-Dhttps.nonProxyHosts=solar-energy-data.helmholtz-berlin.de -Dhttp.nonProxyHosts=solar-energy-data.helmholtz-berlin.de"
    volumes:
      - ./symmetricds/engines:/opt/symmetric-ds/engines
      - ./symmetricds/conf/log4j2.xml:/opt/symmetric-ds/conf/log4j2.xml:ro
      - symmetricds_data:/opt/symmetric-ds/tmp
    ports:
      - "31415:31415"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_ROOT: /data
      BATCH_SIZE: "1000"
      DRY_RUN: "${DRY_RUN:-false}"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

volumes:
  postgres_data:
  symmetricds_data:
