services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    env_file: .env
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_PLACEHOLDERS_SYM_PASSWORD: ${SYM_PASSWORD}
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  symmetricds:
    image: jumpmind/symmetricds:3.17.0
    container_name: symmetricds
    restart: unless-stopped
    env_file: .env
    environment:
      SYM_PASSWORD: ${SYM_PASSWORD}
      SYM_SERVER_ADDRESS: ${SYM_SERVER_ADDRESS}
      SYM_SERVER_PORT: ${SYM_SERVER_PORT}
      no_proxy: grafana01.csn29.bessy.de
      NO_PROXY: grafana01.csn29.bessy.de
      JAVA_OPTS: "-Dhttp.nonProxyHosts=grafana01.csn29.bessy.de|localhost|127.0.0.1"
    volumes:
      - ./symmetricds/engines:/opt/symmetric-ds/engines
    ports:
      - "31415:31415"
    depends_on:
      postgres:
        condition: service_healthy

  restart-orchestrator:
    image: docker:cli
    entrypoint:
      - sh
      - -c
      - |
        INTERVAL=$${RESTART_INTERVAL:-21600}
        echo "[restart-orchestrator] Will restart symmetricds every $${INTERVAL}s"
        while true; do
          sleep $$INTERVAL
          echo "[restart-orchestrator] $(date -u) — restarting symmetricds"
          docker restart -t 30 symmetricds
          echo "[restart-orchestrator] $(date -u) — done"
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - symmetricds
    environment:
      - RESTART_INTERVAL=${RESTART_INTERVAL:-21600}
    restart: unless-stopped

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_ROOT: /data
      BATCH_SIZE: "1000"
      DRY_RUN: "${DRY_RUN:-false}"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      symmetricds:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

volumes:
  postgres_data:
  symmetricds_data:
