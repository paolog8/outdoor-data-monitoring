# Reference only — not mounted into Grafana.
# The outdoor_monitoring datasource is provisioned via the NFS mount.
# This file documents the connection details and UID for use in dashboard JSON.
#
# To find or verify the UID: Grafana → Connections → Data sources → outdoor_monitoring → URL

apiVersion: 1

datasources:
  - name: outdoor_monitoring
    uid: ffk21zlrlrqioe
    type: postgres
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
