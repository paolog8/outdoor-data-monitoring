# Mounted into the grafana container (see docker-compose.yml) — this is a standalone
# instance for outdoor-data-monitoring, separate from the Perocube grafana01 deployment.
#
# To find or verify the UID: Grafana → Connections → Data sources → outdoor_monitoring → URL

apiVersion: 1

datasources:
  - name: outdoor_monitoring
    uid: ffk21zlrlrqioe
    type: postgres
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
